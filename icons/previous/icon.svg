<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#4b97ee"/>
      <stop offset="0.55" stop-color="#2a6fcf"/>
      <stop offset="1" stop-color="#173f8a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0a1f4d" flood-opacity="0.38"/>
    </filter>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#tile)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#shine)"/>
    <g transform="translate(-38 0)">
    <!-- back page -->
    <g transform="rotate(-9 512 540)" filter="url(#sh)">
      <rect x="292" y="250" width="400" height="520" rx="34" fill="#ffffff" fill-opacity="0.42"/>
    </g>
    <!-- front page -->
    <g filter="url(#sh)">
      <rect x="352" y="232" width="420" height="560" rx="36" fill="url(#paper)"/>
    </g>
    <!-- title + subtitle -->
    <rect x="404" y="292" width="210" height="30" rx="15" fill="#1c3f7a"/>
    <rect x="404" y="340" width="140" height="18" rx="9" fill="#a9c3e8"/>
    <!-- KPI cards -->
    <rect x="404" y="390" width="150" height="86" rx="16" fill="#e3ecf9"/>
    <rect x="570" y="390" width="150" height="86" rx="16" fill="#e3ecf9"/>
    <rect x="424" y="414" width="80" height="20" rx="10" fill="#2a78d6"/>
    <rect x="424" y="446" width="50" height="12" rx="6" fill="#1baf7a"/>
    <rect x="590" y="414" width="64" height="20" rx="10" fill="#2a78d6"/>
    <rect x="590" y="446" width="50" height="12" rx="6" fill="#eb6834"/>
    <!-- bar chart -->
    <path d="M404 728 H720" stroke="#c9d6ea" stroke-width="6" stroke-linecap="round"/>
    <path d="M424 726 V618 a12 12 0 0 1 12 -12 h24 a12 12 0 0 1 12 12 V726 Z" fill="#2a78d6"/>
    <path d="M492 726 V572 a12 12 0 0 1 12 -12 h24 a12 12 0 0 1 12 12 V726 Z" fill="#2a78d6"/>
    <path d="M560 726 V640 a12 12 0 0 1 12 -12 h24 a12 12 0 0 1 12 12 V726 Z" fill="#2a78d6"/>
    <path d="M628 726 V530 a12 12 0 0 1 12 -12 h24 a12 12 0 0 1 12 12 V726 Z" fill="#eb6834"/>
    <!-- trend line over bars -->
    <path d="M448 586 L516 540 L584 566 L652 498" fill="none" stroke="#173f8a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="652" cy="498" r="15" fill="#173f8a" stroke="#ffffff" stroke-width="7"/>
  </g>
  </g>
</svg>
